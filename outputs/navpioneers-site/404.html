<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#071116">
  <title>Page Not Found | NavPioneers</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <style>
    :root{--night:#071116;--blue:#38a8ff;--muted:#9bb0bd}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--night);color:#fff;font-family:Arial,sans-serif;display:grid;place-items:center;padding:28px}.panel{width:min(680px,100%);border:1px solid #294b69;border-radius:12px;padding:48px;background:linear-gradient(145deg,#0c1c28,#071116)}.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:22px}.mark{width:26px;height:26px;background:var(--blue);border-radius:7px;position:relative;overflow:hidden}.mark:before,.mark:after{content:'';position:absolute;background:var(--night);transform:rotate(45deg)}.mark:before{width:24px;height:7px;left:-5px;top:9px}.mark:after{width:7px;height:20px;right:4px;top:1px}.eyebrow{font:600 12px monospace;letter-spacing:1.5px;color:var(--blue);margin-top:65px}h1{font-size:clamp(44px,8vw,76px);line-height:1;margin:14px 0}p{color:var(--muted);font-size:17px;line-height:1.6;max-width:500px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:32px}a{display:inline-block;padding:13px 17px;border-radius:5px;font-size:14px;font-weight:800;text-decoration:none}.primary{background:var(--blue);color:var(--night)}.secondary{border:1px solid #3e627a;color:#fff}@media(max-width:560px){.panel{padding:30px}.eyebrow{margin-top:45px}}
  </style>
</head>
<body>
  <main class="panel">
    <div class="brand"><span class="mark"></span>navpioneers</div>
    <div class="eyebrow">ERROR 404 / PAGE NOT FOUND</div>
    <h1>Let’s get you<br>back on the road.</h1>
    <p>The page you requested is not available. Browse the current catalog or send us your vehicle and part number for support.</p>
    <div class="actions"><a class="primary" href="index.html?catalog=1#fitment">Browse Navigation Systems</a><a class="secondary" href="index.html#contact-form">Request Support</a></div>
  </main>
</body>
</html>
